<!DOCTYPE html>
<html lang="en">

<head>
  <title>{Rose}</title>
  <link rel="icon" type="image/x-icon" href="public/favicon.ico">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/rose-remake/manifest.json" />
  <!-- iOS PWA: hide browser chrome when added to home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1B1C22;
    }
    #app {
      width: 100%;
      height: 100%;
    }
  </style>
  <script>
    // Capture the install prompt before the browser hides it.
    // Stored on window so Phaser scenes can access it.
    window._pwaPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window._pwaPrompt = e;
    });
  </script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q3MVKWM856"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-Q3MVKWM856');
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
  
</body>

</html>
